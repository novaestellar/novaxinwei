<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="200" height="200" rx="32" fill="#0a0e17"/>
  <!-- Network nodes -->
  <circle cx="60" cy="70" r="3" fill="#00d4ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="140" cy="55" r="2.5" fill="#00d4ff" opacity="0.5" filter="url(#glow)"/>
  <circle cx="155" cy="130" r="3" fill="#00d4ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="45" cy="140" r="2" fill="#00d4ff" opacity="0.4" filter="url(#glow)"/>
  <circle cx="100" cy="35" r="2" fill="#00d4ff" opacity="0.35" filter="url(#glow)"/>
  <circle cx="170" cy="85" r="2" fill="#00d4ff" opacity="0.4" filter="url(#glow)"/>
  <circle cx="30" cy="105" r="2.5" fill="#00d4ff" opacity="0.45" filter="url(#glow)"/>
  <circle cx="165" cy="165" r="2" fill="#00d4ff" opacity="0.35" filter="url(#glow)"/>
  <!-- Network connections -->
  <line x1="60" y1="70" x2="100" y2="85" stroke="#00d4ff" stroke-width="0.8" opacity="0.25"/>
  <line x1="140" y1="55" x2="100" y2="85" stroke="#00d4ff" stroke-width="0.8" opacity="0.25"/>
  <line x1="155" y1="130" x2="100" y2="85" stroke="#00d4ff" stroke-width="0.8" opacity="0.25"/>
  <line x1="45" y1="140" x2="100" y2="85" stroke="#00d4ff" stroke-width="0.8" opacity="0.2"/>
  <line x1="100" y1="35" x2="100" y2="85" stroke="#00d4ff" stroke-width="0.8" opacity="0.2"/>
  <line x1="170" y1="85" x2="155" y2="130" stroke="#00d4ff" stroke-width="0.6" opacity="0.15"/>
  <line x1="30" y1="105" x2="60" y2="70" stroke="#00d4ff" stroke-width="0.6" opacity="0.15"/>
  <line x1="140" y1="55" x2="170" y2="85" stroke="#00d4ff" stroke-width="0.6" opacity="0.15"/>
  <!-- Center: stylized 新 character as abstract mark -->
  <g transform="translate(100,88)" filter="url(#glow)">
    <!-- Horizontal strokes -->
    <rect x="-18" y="-22" width="36" height="3" rx="1.5" fill="url(#grad)"/>
    <rect x="-14" y="-14" width="28" height="2.5" rx="1.25" fill="url(#grad)" opacity="0.9"/>
    <rect x="-18" y="-6" width="36" height="3" rx="1.5" fill="url(#grad)"/>
    <!-- Vertical stroke -->
    <rect x="-2" y="-26" width="3" height="42" rx="1.5" fill="url(#grad)" opacity="0.85"/>
    <!-- Left diagonal -->
    <line x1="-14" y1="-2" x2="-8" y2="16" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Right diagonal -->
    <line x1="14" y1="-2" x2="8" y2="16" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Bottom bar -->
    <rect x="-16" y="18" width="32" height="2.5" rx="1.25" fill="url(#grad)" opacity="0.75"/>
  </g>
  <!-- Subtle ring -->
  <circle cx="100" cy="88" r="38" fill="none" stroke="#00d4ff" stroke-width="0.6" opacity="0.15"/>
</svg>
